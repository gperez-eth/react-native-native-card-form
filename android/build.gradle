apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.mackenrow.nativecard'
version = '0.1.0'

android {
  namespace 'com.mackenrow.nativecard'
  compileSdkVersion rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'com.stripe:stripe-android:21.29.2'
  // CardValidation.kt touches no android.* API (Stripe's own CardUtils/
  // CardBrand are plain JVM classes), so its tests run as fast local JVM unit
  // tests — no Robolectric, no emulator, no androidTest.
  testImplementation 'junit:junit:4.13.2'
}
