name: Package CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Lints and builds the JS/TS package, and runs the two Node-only checks
  # (fixture consistency, npm tarball contents). No native code involved.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - run: npm run check:validation
      - run: npm run check:tarball

  # Real JUnit tests for android/.../CardValidation.kt, run against the
  # actual compiled Stripe Android SDK — not a JS reimplementation of it.
  # Needs the example app's `expo prebuild` first: this package is an Expo
  # autolinked module with no Gradle wrapper of its own, so the test task
  # only exists once a host app's build generates one that includes it.
  # `assembleDebug` is NOT run here on purpose — that's what the `example`
  # job below checks, and this job doesn't need the whole app built just to
  # run one module's unit tests.
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm pack
      - run: cd example && npm install ../react-native-native-card-form-*.tgz
      - run: cd example && npx expo prebuild --platform android --no-install
      - run: cd example/android && ./gradlew :native-card-form:testDebugUnitTest

  # Real XCTest for ios/CardValidation.swift, run against the actual
  # compiled Stripe iOS SDK on a booted simulator. Independent of the npm
  # package entirely: `Package.swift` at the repo root pulls Stripe via SPM
  # directly, so this needs no `npm install`/`expo prebuild` — it is the
  # fastest job in this workflow for exactly that reason.
  test-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an available iOS simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["isAvailable"]:
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - run: xcodebuild test -scheme NativeCardFormValidation -destination "id=$UDID"

  # Builds the full example app from a real `npm pack` tarball, the way an
  # actual consumer would install this package — the packaging/integration
  # smoke test. It does NOT run any unit test: a green check here means "the
  # package installs and compiles into a working app", not "the validation
  # logic is correct" (that's test-android / test-ios above).
  example:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm pack
      - run: cd example && npm install ../react-native-native-card-form-*.tgz
      - if: runner.os == 'Linux'
        run: >-
          cd example && npx expo prebuild --platform android --no-install &&
          cd android && ./gradlew assembleDebug
      - if: runner.os == 'macOS'
        run: >-
          cd example && npx expo prebuild --platform ios --no-install &&
          cd ios && pod install &&
          xcodebuild -workspace NativeCardFormExample.xcworkspace
          -scheme NativeCardFormExample -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          IPHONEOS_DEPLOYMENT_TARGET=15.1 CODE_SIGNING_ALLOWED=NO build
